<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبارات القرآن الكريم</title>
<style>
  :root{ --navy:#0F2440; --gold:#C7963E; --paper:#FBF8F0; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
        background:linear-gradient(160deg,#0F2440,#1E3F66); font-family:'Cairo','Tajawal',system-ui,sans-serif; }
  .card{ width:100%; max-width:380px; background:var(--paper); border-radius:20px; border-top:4px solid var(--gold);
         padding:26px 20px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1{ margin:0 0 4px; font-size:24px; color:var(--navy); }
  p{ margin:0 0 20px; color:#7C8A7E; font-size:14px; }
  a.btn{ display:block; margin-bottom:14px; padding:18px 14px; border-radius:14px; text-decoration:none;
         font-size:19px; font-weight:700; color:#F4EFDC; background:var(--navy); }
  a.btn.gold{ background:var(--gold); color:var(--navy); }
  a.btn small{ display:block; margin-top:4px; font-size:12.5px; font-weight:400; opacity:.85; }
</style>
</head>
<body>
  <div class="card">
    <h1>اختبارات القرآن الكريم</h1>
    <p>اختاري البرنامج</p>
    <a class="btn" href="quran-v5.html">📖 سجل اختبارات القرآن<small>تسجيل ومتابعة الاختبارات</small></a>
    <a class="btn gold" href="surah-v3.html">🎙️ اختبار على سورة جديدة<small>اختبار سورة واحدة لكل فصل</small></a>
  </div>
</body>
</html>
