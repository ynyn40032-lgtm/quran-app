<script>
/* منع النسخ القديمة: عند كل فتح بنسأل السيرفر (طلب خفيف) هل الملف اتغيّر؟ لو اتغيّر بنجيب النسخة الجديدة ونعيد التحميل مرة واحدة */
(function(){
  try{
    if(!/^https?:$/.test(location.protocol)) return;
    var u = location.pathname, key = 'appver:' + u;
    fetch(u, {method: 'HEAD', cache: 'no-store'}).then(function(r){
      var v = (r.headers.get('etag') || '') + '|' + (r.headers.get('last-modified') || '');
      if(v === '|') return;
      var old = null; try{ old = localStorage.getItem(key); }catch(e){}
      try{ localStorage.setItem(key, v); }catch(e){}
      var done = null; try{ done = sessionStorage.getItem(key); }catch(e){}
      if((!old || old !== v) && !done){
        try{ sessionStorage.setItem(key, '1'); }catch(e){}
        fetch(u, {cache: 'reload'}).then(function(){ location.reload(); }).catch(function(){});
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>

<script>
/* تنضيف النسخ القديمة المتخزنة: بيشيل أي service worker وكاش قديم عشان التعديلات تظهر على طول */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    var had = rs.length;
    return Promise.all(rs.map(function(r){ return r.unregister(); })).then(function(){
      return window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : 0;
    }).then(function(){
      if(had && !sessionStorage.getItem('swCleaned')){ sessionStorage.setItem('swCleaned', '1'); location.reload(); }
    });
  }).catch(function(){});
}
</script>

function shotBlob(canvas){ return new Promise(res => canvas.toBlob(res, 'image/png')); }
async function buildShots(){
  const box = document.createElement('div'); box.id = 'shotBox';
  const hd = document.querySelector('header').cloneNode(true);
  const hb = hd.querySelector('.hbtns'); if(hb) hb.remove();
  box.appendChild(hd);
  const main = document.createElement('main');
  main.style.cssText = 'padding:14px;max-width:none';
  const f = (MN_SEL !== 'all' ? '<div style="text-align:center;font-weight:800;margin-bottom:8px">🗓️ شهر ' + esc(mnFull(MN_SEL)) + '</div>' : '') + (filter !== 'all' ? '<div style="text-align:center;font-weight:800;margin-bottom:8px">' + esc(filter) + '</div>' : '');
  main.innerHTML = f + '<div class="sum">' + $('sum').innerHTML + '</div><div>' + $('list').innerHTML + '</div>';
  box.appendChild(main);
  document.body.appendChild(box);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const opt = {backgroundColor:'#FBF8F0', useCORS:true, logging:false, scrollX:0, scrollY:0, windowWidth:430};
    const W = box.offsetWidth, H = box.offsetHeight;
    // لو الطول كبير أوي نقسّم الصور على حدود كروت الفصول عشان الموبايل مايرفضش
    if(W * H * 4 <= 14e6){
      const c = await html2canvas(box, Object.assign({scale:2}, opt));
      return [await shotBlob(c)];
    }
    const out = [];
    const cards = Array.from(box.querySelectorAll('.cls'));
    const groups = []; let cur = [], curH = 0;
    cards.forEach(c => { const h = c.offsetHeight; if(cur.length && curH + h > 3200){ groups.push(cur); cur = []; curH = 0; } cur.push(c); curH += h; });
    if(cur.length) groups.push(cur);
    for(let i = 0; i < groups.length; i++){
      const keep = new Set(groups[i]);
      cards.forEach(c => { c.style.display = keep.has(c) ? '' : 'none'; });
      main.querySelector('.sum').style.display = i === 0 ? '' : 'none';
      hd.style.display = i === 0 ? '' : 'none';
      const c = await html2canvas(box, Object.assign({scale:2}, opt));
      out.push(await shotBlob(c));
    }
    return out;
  } finally { box.remove(); }
}

  function overlayBack(closeUI){
    let done = false; const tok = {}; OV_STACK.push(tok);
    try{ history.pushState({shkOv: 1}, ''); }catch(e){}
    const drop = () => { const i = OV_STACK.indexOf(tok); if(i >= 0) OV_STACK.splice(i, 1); };
    const onPop = () => { if(done || OV_STACK[OV_STACK.length - 1] !== tok) return; done = true; drop(); window.removeEventListener('popstate', onPop); closeUI(); };

  /* بنحفظ نسخة مصغّرة من اختبارات كل المختبِرات على الجهاز، عشان «الاختبارات القادمة» في القائمة الرئيسية تشيل الفصل اللي اختبر حتى لو اتسجل عند محفظة تانية */
  function ctCacheTested(){
    try{
      const norm = x => String(x || '').replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\([^)]*\)/g, '').replace(/^\s*فصل\s+/, '').replace(/\s+/g, ' ').trim();
      const lim = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10), arr = [];
      results.forEach(r => { if(!r || !r.className || !r.date || !valid(r)) return; const d = String(r.date).slice(0, 10); if(d < lim) return; arr.push({d: d, n: norm(r.className), b: r.branch || '', k: kindOf(r) === 's' ? 'surah' : 'juz'}); });
      localStorage.setItem('quran-sheikh:tested', JSON.stringify(arr));
    }catch(e){}
  }
  window.__ctRefresh = () => {
    try{ ctCacheTested(); }catch(e){}
    try{ const b = $('ctBtn'); if(b){ const n = ctRows().filter(r => mnOf(r) === ctNow()).length; b.textContent = '🎓 الشهادات' + (n ? ' (' + n + ')' : ''); } }catch(e){}
    try{ ctBanner(); }catch(e){}
    try{ if(document.getElementById('ctOv') && window.__ctDraw) window.__ctDraw(); }catch(e){}
  };
  $('ctBtn').addEventListener('click', openCerts);
  window.__ctRefresh();

  $('trBtn').addEventListener('click', openReports);
  window.openClassReport = openReport;
  $('crBtn').addEventListener('click', openReport);
})();
</script>
<script>
/* أزرار التكبير والتصغير (نفس اللي في برنامج الاختبارات بالظبط) */
(function(){
  var STEP = 0.1, MIN = 0.5, MAX = 2.0;
  var zoom = parseFloat(localStorage.getItem('sheikhZoomLevel')) || 1;

  function apply(){
    document.body.style.zoom = zoom;
    localStorage.setItem('sheikhZoomLevel', zoom);
    label.textContent = Math.round(zoom * 100) + '%';
    /* بعد التكبير/التصغير: نخلّي التقارير المفتوحة تعيد ضبط عرضها على الشاشة عشان مفيش حاجة تتقص */
    try{ setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 0); }catch(e){}
  }

  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;right:10px;bottom:14px;z-index:2147483647;display:flex;flex-direction:column;align-items:center;gap:6px;background:#0F2440;border-radius:14px;padding:8px 6px;box-shadow:0 4px 14px rgba(0,0,0,0.3);font-family:sans-serif;opacity:0.85;';

  function makeBtn(text, onClick){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.style.cssText = 'width:38px;height:38px;border:none;border-radius:10px;background:#C7963E;color:#0F2440;font-size:20px;font-weight:800;line-height:1;';
    b.onclick = onClick;
    return b;
  }

  var plusBtn = makeBtn('+', function(){
    zoom = Math.min(MAX, Math.round((zoom + STEP) * 100) / 100);
    apply();
  });
  var minusBtn = makeBtn('−', function(){
    zoom = Math.max(MIN, Math.round((zoom - STEP) * 100) / 100);
    apply();
  });
  var label = document.createElement('div');
  label.style.cssText = 'color:#F4EFDC;font-size:11px;font-weight:700;';

  var zHidden = false;
  try{ zHidden = localStorage.getItem('sheikhZoomHidden') === '1'; }catch(e){}
  var zHideBtn = document.createElement('button');
  zHideBtn.type = 'button'; zHideBtn.textContent = '✕'; zHideBtn.setAttribute('aria-label', 'إخفاء أزرار التكبير');
  zHideBtn.style.cssText = 'width:38px;height:24px;border:none;border-radius:8px;background:#5b6b82;color:#fff;font-size:13px;font-weight:800;line-height:1;padding:0;';
  var zTab = document.createElement('button');
  zTab.type = 'button'; zTab.textContent = '‹'; zTab.setAttribute('aria-label', 'إظهار أزرار التكبير');
  zTab.style.cssText = 'position:fixed;right:0;bottom:20px;z-index:2147483647;width:20px;height:44px;border:none;border-radius:10px 0 0 10px;background:#0F2440;color:#C7963E;font:700 16px sans-serif;padding:0;opacity:0.7;display:none;';
  function zApply(){
    wrap.style.display = zHidden ? 'none' : 'flex';
    zTab.style.display = 'none'; /* التابّ الصغير › متشالش من الشاشة خالص — الإظهار من قايمة ☰ */
    try{ localStorage.setItem('sheikhZoomHidden', zHidden ? '1' : '0'); }catch(e){}
  }
  zHideBtn.onclick = function(){ zHidden = true; zApply(); };
  zTab.onclick = function(){ zHidden = false; zApply(); };
  window.__sheikhZoomToggle = function(){ zHidden = !zHidden; zApply(); };
  window.__sheikhZoomShow = function(){ zHidden = false; zApply(); };
  function zMount(){ document.documentElement.appendChild(zTab); zApply(); }
  if (document.readyState !== 'loading') zMount(); else document.addEventListener('DOMContentLoaded', zMount);

  wrap.appendChild(zHideBtn);
  wrap.appendChild(plusBtn);
  wrap.appendChild(label);
  wrap.appendChild(minusBtn);
  document.addEventListener('DOMContentLoaded', function(){
    document.body.appendChild(wrap);
    apply();
  });
  if (document.readyState !== 'loading'){
    document.body.appendChild(wrap);
    apply();
  }
  /* أي شاشة بتتفتح (المحفظات / التقارير / إجمالي الفصول) بتتضاف في الآخر، فبنرجّع أزرار التكبير في الآخر عشان تفضل ظاهرة فوقها */
  try{
    new MutationObserver(function(){
      if(wrap.parentNode === document.body && document.body.lastElementChild !== wrap) document.body.appendChild(wrap);
    }).observe(document.body || document.documentElement, {childList: true});
  }catch(e){}
})();
</script>
<script>
/* زرار ☰ العايم (نفس اللي في برنامج الاختبارات): بيتسحب فوق وتحت، ودوسي عليه تفتح قايمة فيها الصعود والنزول وأزرار التكبير */
(function(){
  var POS = 'sfl:pos';
  function lget(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lset(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  var st = document.createElement('style');
  st.textContent =
    '#sflHandle{position:fixed;left:6px;top:46%;z-index:2147483647;width:40px;height:40px;border-radius:50%;border:2px solid #C7963E;background:#0F2440;color:#fff;font:700 20px/1 Cairo,Tahoma,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.45);padding:0;touch-action:none;cursor:pointer;}' +
    '#sflTray{position:fixed;left:54px;z-index:2147483647;display:none;min-width:190px;max-width:calc(100vw - 70px);max-height:calc(100vh - 24px);overflow-y:auto;background:#FBF8F0;border:2px solid #C7963E;border-radius:16px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.4);direction:rtl;}' +
    '#sflTray.open{display:block;}' +
    '#sflTray button{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 6px;padding:10px 12px;border:1.5px solid #0F2440;border-radius:12px;background:#fff;color:#0F2440;font:700 15px Cairo,Tahoma,sans-serif;text-align:right;cursor:pointer;}' +
    '#sflTray button:last-child{margin-bottom:0;}' +
    '#sflTray button .ic{min-width:28px;text-align:center;font-size:20px;}';
  document.head.appendChild(st);
  var handle = document.createElement('button'); handle.id = 'sflHandle'; handle.type = 'button'; handle.textContent = '☰'; handle.setAttribute('aria-label', 'القائمة');
  var tray = document.createElement('div'); tray.id = 'sflTray';
  document.documentElement.appendChild(handle); document.documentElement.appendChild(tray);
  try{ var sp = JSON.parse(lget(POS) || 'null'); if(sp){ handle.style.top = Math.max(0, Math.min(sp.y, innerHeight - 50)) + 'px'; } }catch(e){}

  /* السكرول: بنلاقي العنصر اللي بيتحرك فعلًا (الصفحة أو نافذة التقرير) */
  function scroller(){
    var el = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
    while(el && el !== document.body && el !== document.documentElement){
      var cs = getComputedStyle(el), oy = cs.overflowY;
      if((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 20) return el;
      el = el.parentElement;
    }
    return document.scrollingElement || document.documentElement;
  }
  function goTo(where){
    var s = scroller(), max = s.scrollHeight - s.clientHeight;
    var y = where === 'top' ? 0 : (where === 'bottom' ? max : max / 2);
    try{ s.scrollTo({top: y, behavior: 'smooth'}); }catch(e){ s.scrollTop = y; }
  }
  var ITEMS = [
    {ic: '⬆️', lab: 'فوق (أول الصفحة)', fn: function(){ goTo('top'); }},
    {ic: '↕️', lab: 'نص الصفحة', fn: function(){ goTo('mid'); }},
    {ic: '⬇️', lab: 'تحت (آخر الصفحة)', fn: function(){ goTo('bottom'); }},
    {ic: '🔍', lab: 'أزرار التكبير والتصغير', fn: function(){ try{ if(window.__sheikhZoomToggle) window.__sheikhZoomToggle(); }catch(e){} }},
    {ic: '↩️', lab: 'رجّعي الأزرار مكانها زي الأول', fn: function(){
      try{ localStorage.removeItem(POS); }catch(e){}
      handle.style.top = '46%';
      try{ if(window.__sheikhZoomShow) window.__sheikhZoomShow(); }catch(e){}
    }}
  ];
  ITEMS.forEach(function(it){
    var b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<span class="ic">' + it.ic + '</span><span>' + it.lab + '</span>';
    b.addEventListener('click', function(){ close(); setTimeout(it.fn, 30); });
    tray.appendChild(b);
  });
  function place(){ var r = handle.getBoundingClientRect(), h = tray.offsetHeight, top = r.top; if(top + h > innerHeight - 8) top = Math.max(8, innerHeight - 8 - h); tray.style.top = top + 'px'; }
  function open(){ tray.classList.add('open'); place(); }
  function close(){ tray.classList.remove('open'); }
  function toggle(){ tray.classList.contains('open') ? close() : open(); }
  document.addEventListener('pointerdown', function(e){ if(tray.classList.contains('open') && !tray.contains(e.target) && e.target !== handle) close(); }, true);

  /* سحب الزرار لفوق/تحت */
  (function(){
    var sy, oy, drag = false, moved = false;
    handle.addEventListener('pointerdown', function(e){ drag = true; moved = false; sy = e.clientY; oy = handle.getBoundingClientRect().top; try{ handle.setPointerCapture(e.pointerId); }catch(_){} });
    handle.addEventListener('pointermove', function(e){
      if(!drag) return; var dy = e.clientY - sy; if(!moved && Math.abs(dy) < 8) return; moved = true;
      handle.style.top = Math.max(0, Math.min(oy + dy, innerHeight - 44)) + 'px'; if(tray.classList.contains('open')) place(); e.preventDefault();
    });
    function end(){ if(!drag) return; drag = false; if(moved) lset(POS, JSON.stringify({y: parseFloat(handle.style.top)})); else toggle(); }
    handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', function(){ drag = false; });
  })();
})();
</script>
