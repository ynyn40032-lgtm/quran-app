<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير الشيخ — مركز الأمين</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{ box-sizing:border-box; }
  :root{ --navy:#0F2440; --gold:#C7963E; --cream:#FBF8F0; --line:#EAE1C7; --muted:#7C8A7E; --ok:#0F5132; --okbg:#DDF0E3; --bad:#A3312B; --badbg:#F6DCDA; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--cream); color:var(--navy); font-family:'Cairo','Tajawal',system-ui,sans-serif; padding-bottom:env(safe-area-inset-bottom,0); }
  header{ background:linear-gradient(160deg,#0F2440,#1E3F66); color:#F4EFDC; padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px; border-bottom:3px solid var(--gold); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  header h1{ margin:0; font-size:20px; }
  header small{ display:block; font-size:12px; opacity:.8; direction:ltr; text-align:right; }
  #logoutBtn{ background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:999px; padding:8px 14px; font:inherit; font-size:13px; cursor:pointer; }
  main{ max-width:720px; margin:0 auto; padding:14px; }
  #login{ position:fixed; inset:0; z-index:10; background:linear-gradient(160deg,#0F2440,#1E3F66); display:flex; align-items:center; justify-content:center; padding:20px; }
  #login .box{ width:100%; max-width:360px; background:var(--cream); border-radius:20px; border-top:4px solid var(--gold); padding:24px 20px; text-align:center; }
  #login h2{ margin:0 0 4px; }
  #login p{ margin:0 0 16px; color:var(--muted); font-size:14px; }
  input{ width:100%; padding:12px; margin-bottom:10px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:16px; background:#fff; }
  .primary{ width:100%; padding:13px; background:var(--navy); color:#F4EFDC; border:0; border-radius:10px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .primary:disabled{ opacity:.6; }
  #loginMsg{ color:var(--bad); font-size:14px; min-height:20px; margin-top:10px; }
  #forgot{ color:#9C6F22; font-size:13px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .chip{ flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--navy); border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
  .chip.on{ background:var(--navy); color:#F4EFDC; border-color:var(--navy); }
  .sum{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .sum div{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center; font-size:13px; color:var(--muted); }
  .sum b{ display:block; font-size:22px; color:var(--navy); }
  .sum .g b{ color:var(--ok); } .sum .r b{ color:var(--bad); }
  .cls{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .cls h3{ margin:0 0 6px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:17px; }
  .cls h3 span{ font-size:13px; font-weight:600; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); }
  .row .meta{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.6; }
  .row .note{ font-size:12.5px; margin-top:3px; background:#FFF8E6; border-radius:8px; padding:4px 8px; }
  .badge{ display:inline-block; border-radius:999px; padding:2px 10px; font-weight:700; font-size:13px; white-space:nowrap; }
  .badge.ok{ background:var(--okbg); color:var(--ok); } .badge.bad{ background:var(--badbg); color:var(--bad); }
  .score{ text-align:left; font-size:12px; color:var(--muted); }
  .new{ display:inline-block; background:var(--bad); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; margin-inline-start:6px; }
  .empty{ text-align:center; color:var(--muted); padding:40px 10px; line-height:1.9; }
  header{ padding-left:110px; }
  .row{ flex-wrap:wrap; }
  .dt{ flex:1 1 100%; margin-top:2px; }
  .dt > summary{ cursor:pointer; list-style:none; display:inline-block; font-size:13px; font-weight:700; color:var(--navy); background:#F4EFDC; border-radius:999px; padding:3px 12px; }
  .dt > summary::-webkit-details-marker{ display:none; }
  .dt[open] > summary{ background:var(--navy); color:#F4EFDC; }
  .dt .qq{ border-top:1px dashed var(--line); padding:7px 2px; font-size:13px; line-height:1.9; }
  .dt .qq:first-of-type{ border-top:0; }
  .dt .er{ margin:2px 0 0; padding-inline-start:4px; }
  .dt .wd{ font-family:'UthmanicHafs','Amiri Quran','Amiri',serif; font-size:19px; color:#0F2440; }
  .dt .sd{ font-family:'UthmanicHafs','Amiri Quran','Amiri',serif; font-size:19px; color:var(--bad); }
  .dt .fu{ background:#F3F7FD; border:1.5px dashed #3D6AA5; border-radius:10px; padding:6px 10px; margin:6px 0; font-size:13px; line-height:1.9; color:#1F4A7A; }
  .dt .fut{ display:inline-block; background:#EAF1FB; border:1px solid #3D6AA5; border-radius:8px; padding:0 7px; font-size:12px; font-weight:700; color:#1F4A7A; }
  .fub{ font-size:12px; font-weight:700; color:#1F4A7A; margin-top:3px; }
  .dt .ty{ display:inline-block; background:#F6EBD0; border:1px solid #C7963E; border-radius:8px; padding:0 7px; font-size:12px; font-weight:700; color:#5B3F0C; }
  .dt .pb{ background:#FFF3F1; border-right:4px solid var(--bad); border-radius:6px; padding:4px 9px; margin:5px 0; font-size:13px; }
  .dt .none{ font-size:12.5px; color:var(--muted); padding:4px 2px; }
  .lv{ display:inline-block; border-radius:999px; padding:1px 10px; font-size:12px; font-weight:800; color:#fff; margin-inline-start:6px; }
  .lv.g{ background:#2E6B4A; } .lv.m{ background:#B8860B; } .lv.w{ background:#A3312B; }
  .csum{ background:#F4EFDC; border-radius:10px; padding:7px 11px; font-size:13px; line-height:1.9; margin:4px 0 6px; }
.sec{ margin:14px 0 4px; padding:7px 12px; border-radius:10px; background:#0F2440; color:#fff; font-weight:800; font-size:14px; display:flex; justify-content:space-between; gap:8px; } .sec span{ font-weight:600; font-size:12.5px; opacity:.9; }
  #shareBtn{ background:#C7963E; color:#0F2440; border:0; border-radius:999px; padding:8px 14px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
  #shareBtn:disabled{ opacity:.6; }
  .hbtns{ display:flex; gap:8px; align-items:center; }
  #shotBox{ position:absolute; top:0; left:0; width:430px; z-index:-1; background:#FBF8F0; pointer-events:none; }
  #shotBox header{ padding-left:16px !important; }
  #shotBox .cls{ margin-bottom:12px; }
  .tools{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tools button{ flex:1 1 140px; border:1.5px solid var(--gold); background:#fff; color:var(--navy); border-radius:12px; padding:9px 8px; font:inherit; font-size:13.5px; font-weight:800; cursor:pointer; }
  .pm{ flex:1 1 100%; margin-top:6px; border:0; background:#E3F2E8; color:#1F5A3B; border-radius:10px; padding:7px 10px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div style="font-size:14px;color:#8A4B1E;font-weight:800;margin-bottom:6px">✦ مركز الأمين الثقافي التربوي ✦<div style="font-size:12px;font-weight:700">لتحفيظ القرآن الكريم</div></div><h2>📋 تقارير الشيخ</h2>
    <p>ادخل بإيميلك وكلمة السر لتشوف الاختبارات</p>
    <input id="em" type="email" dir="ltr" placeholder="الإيميل" autocomplete="username">
    <input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password">
    <button id="loginBtn" class="primary" type="button">دخول</button>
    <div id="loginMsg"></div>
    <a id="forgot" href="#">نسيت كلمة السر؟</a>
  </div>
</div>

<header>
  <div><div style="font-size:12px;color:#E8C46B;font-weight:800;margin-bottom:2px">✦ مركز الأمين الثقافي التربوي ✦<div style="font-size:11px;font-weight:700;opacity:.9">لتحفيظ القرآن الكريم</div></div><h1>📋 تقارير الشيخ</h1><small id="who"></small></div>
  <div class="hbtns"><button id="shareBtn" type="button">📤 مشاركة</button><button id="logoutBtn" type="button">خروج</button></div>
</header>

<main>
  <div id="pf" class="chips"></div>
  <div id="chips" class="chips"></div>
  <div class="tools"><button id="crBtn" type="button" style="background:#0F2440;color:#F4EFDC;border-color:#0F2440">📊 تقرير إجمالي الفصول</button><button id="xlBtn" type="button">⬇ تصدير Excel</button><button id="bkBtn" type="button">💾 نسخة احتياطية</button></div>
  <div id="sum" class="sum"></div>
  <div id="list"></div>
</main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAjr3fKiGeWU2KOftf52eGogRD2OHq5mpo",
  authDomain: "quran-tests-645cd.firebaseapp.com",
  projectId: "quran-tests-645cd",
  storageBucket: "quran-tests-645cd.firebasestorage.app",
  messagingSenderId: "946216956918",
  appId: "1:946216956918:web:1946eb27cff9772dae8dd7"
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHEIKH_EMAILS = ['sheikh@alamin.com']; // حسابات الشيخ: بتشوف كل الفصول
const SEEN_KEY = 'teacher:seen';
let seen = {}, results = [], filter = 'all', first = true, unsub = null;
try{ seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }catch(e){}

function authErr(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'الإيميل أو كلمة السر غير صحيحة';
  if(/too-many/.test(c)) return 'محاولات كتير، استني شوية وجرّبي تاني';
  if(/network/.test(c)) return 'مفيش اتصال بالنت';
  return 'حصلت مشكلة، جرّبي تاني';
}


// منع تكرار نفس الاختبار: لو نفس الطالب/التاريخ/الفصل/نوع الاختبار/الدرجة اتبعت أكتر من مرة (من جهازين أو حسابين) بنعرضه مرة واحدة
const nrm = t => String(t == null ? '' : t).replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase();
function canonClasses(list){
  const strip = c => nrm(c).replace(/^فصل\s+/, ''), isF = c => /^\s*فصل\s/.test(c || ''), pref = {};
  list.forEach(r => { const k = strip(r.className || ''); if(!k) return; const cur = pref[k]; if(!cur || (isF(r.className) && !isF(cur))) pref[k] = r.className; });
  list.forEach(r => { const k = strip(r.className || ''); if(pref[k]) r.className = pref[k]; });
  return list;
}
function dedupe(list){
  const m = new Map();
  list.forEach(r => {
    const k = r.app === 'surah'
      ? [nrm(r.student), r.date || '', 'surah', r.grade].join('|')
      : [nrm(r.student), r.date || '', nrm(r.className), r.app || '', nrm(r.testType), r.grade, r.hizb == null ? '' : r.hizb, r.rub || ''].join('|');
    const cur = m.get(k);
    if(!cur || (r.ts || 0) > (cur.ts || 0)) m.set(k, r);
  });
  window.__dups = list.length - m.size;
  return Array.from(m.values());
}
if(typeof firebase === 'undefined'){
  $('loginBtn').disabled = true;
  $('loginMsg').innerHTML = '⚠️ مقدرتش أحمّل مكتبات الاتصال (Firebase).<br>اتأكدي من النت، أو افتحي البرنامج من Chrome/Safari مش من جوه واتساب، وبعدين <a href="" onclick="location.reload();return false">حدّثي الصفحة</a>.';
  throw new Error('firebase not loaded');
}
/* جلسة دخول مستقلة لصفحات العرض (الشيخ/المعلمات) عشان متتخبطش مع حساب المختبِرة في برنامج الاختبارات */
const FB_VIEWER = firebase.initializeApp(FIREBASE_CONFIG, 'viewer');
const auth = FB_VIEWER.auth(), db = FB_VIEWER.firestore();

$('loginBtn').onclick = async () => {
  const em = $('em').value.trim(), pw = $('pw').value;
  if(!em || !pw){ $('loginMsg').textContent = 'اكتبي الإيميل وكلمة السر'; return; }
  $('loginBtn').disabled = true; $('loginMsg').textContent = 'جاري الدخول...';
  try{ await auth.signInWithEmailAndPassword(em, pw); $('loginMsg').textContent = ''; }
  catch(e){ $('loginMsg').textContent = authErr(e); }
  $('loginBtn').disabled = false;
};
$('forgot').onclick = async ev => {
  ev.preventDefault();
  const em = $('em').value.trim();
  if(!em){ $('loginMsg').textContent = 'اكتبي الإيميل الأول'; return; }
  try{ await auth.sendPasswordResetEmail(em); $('loginMsg').textContent = 'اتبعتلك رابط تغيير كلمة السر على الإيميل'; }
  catch(e){ $('loginMsg').textContent = authErr(e); }
};
$('logoutBtn').onclick = async () => { await auth.signOut(); location.reload(); };

auth.onAuthStateChanged(u => {
  if(unsub){ unsub(); unsub = null; }
  if(!u){ $('login').style.display = 'flex'; return; }
  $('login').style.display = 'none';
  $('who').textContent = u.email || '';
  // كل معلمة بتشوف بس النتايج اللي ownerEmail بتاعها = إيميلها
  const _em = String(u.email || '').toLowerCase();
  const _q = SHEIKH_EMAILS.indexOf(_em) !== -1 ? db.collection('classResults') : db.collection('classResults').where('ownerEmail', '==', _em);
  unsub = _q
    .onSnapshot(snap => {
      const list = []; snap.forEach(d => { const x = d.data(); x.id = d.id; list.push(x); });
      results = dedupe(canonClasses(list));
      render();
      if(window.__crRedraw) window.__crRedraw();
      else if(first && window.openClassReport) window.openClassReport();
      if(first){ first = false; }
    }, err => {
      $('list').innerHTML = '<div class="empty">⚠️ ماقدرتش أحمّل النتايج.<br>' +
        (err && err.code === 'permission-denied' ? 'الصلاحيات في قاعدة البيانات مش مفعّلة للمعلمات بعد (اتأكدي من قواعد Firestore).' : 'اتأكدي من النت وجرّبي تاني.') + '</div>';
    });
});


const TYPE_LABELS = {tsf:'تشكيل: فتحة', tsk:'تشكيل: كسرة', tsd:'تشكيل: ضمة', tss:'تشكيل: سكون', prn:'نطق كلمة غلط', hes:'تردد', fgt:'نسيان كلمة', swW:'تبديل: كلمة مكان كلمة', swA:'تبديل: آية مكان آية', tsh:'تشكيل', swp:'تبديل كلمة'};
const NOTE_LABELS = {nhs:'⏳ تردد بسيط', nst:'✋ وقف على الكلمة', ncf:'🌀 تلخبط في الكلمة', nfc:'👀 عدم تركيز'};
const FLAG_LABELS = {loose:'〰️ حفظ متلقلق / غير متقن', many:'⏳ ترددات كتيرة', conf:'🌀 تلخبط في التسميع', stop:'✋ وقفات كتيرة', focus:'👀 عدم تركيز'};
const gflagsOf = r => { const q = (Array.isArray(r.questions) ? r.questions : [])[0]; return (q && Array.isArray(q.gflags)) ? q.gflags.filter(k => FLAG_LABELS[k]) : []; };
const fnotesOf = r => { const o = []; (Array.isArray(r.questions) ? r.questions : []).forEach(q => { (Array.isArray(q.fnotes) ? q.fnotes : []).forEach(n => { if(n && n.w && NOTE_LABELS[n.t]) o.push({surah: q.surah || '', word: n.w, ayah: n.a || '', type: n.t}); }); }); return o; };
const tl = t => TYPE_LABELS[t] || (t ? String(t) : 'نوع غير محدد');
const AD = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function pctOf(r){ const g = parseFloat(r.grade); if(isNaN(g) || r.grade === '' || r.grade == null) return null; return g / (r.app === 'surah' ? 10 : 100) * 100; }
function lvlOf(p){ return p === null ? null : (p >= 95 ? {k:'g', t:'شاطر'} : {k:'w', t:'ضعيف'}); }
function fixSaid(s){
  s = String(s || ''); var out = [], cur = '';
  var flush = function(){ if(!cur) return; var hasV = /[\u064B-\u0650\u08F0-\u08F2]/.test(cur); out.push(hasV ? cur.replace(/[\u0652\u06E1]/g, '') : cur); cur = ''; };
  Array.from(s).forEach(function(ch){ if(/\p{M}/u.test(ch) && cur) cur += ch; else { flush(); cur = ch; } });
  flush(); return out.join('');
}
function errsOf(r){
  const out = [];
  (Array.isArray(r.questions) ? r.questions : []).forEach(q => {
    String(q.words || '').split(/\s*،\s*/).filter(Boolean).forEach((it, k) => {
      const m = it.match(/^(.*?)\s*\(آية\s*([^)]*)\)\s*$/);
      out.push({surah: q.surah || '', word: m ? m[1] : it, ayah: m ? m[2] : '', type: (q.wordTypes || [])[k] || '', said: fixSaid((q.wordSaid || [])[k] || '')});
    });
  });
  return out;
}
function topN(map, n){ return Object.keys(map).map(k => [k, map[k]]).sort((a, b) => b[1] - a[1]).slice(0, n); }
function detailHtml(r){
  if(!Array.isArray(r.questions) || !r.questions.length){
    return (r.mistakes > 0) ? '<div class="dt"><div class="none">تفاصيل الأخطاء بالكلمات هتظهر هنا بعد ما المختبِرة تفتح برنامج الاختبارات وتتزامن النتايج.</div></div>' : '';
  }
  const p = pctOf(r), lv = lvlOf(p), errs = errsOf(r);
  const tcount = {}; errs.forEach(e => { const l = tl(e.type); tcount[l] = (tcount[l] || 0) + 1; });
  let h = '<details class="dt"' + ' open' + '><summary>🔍 تفاصيل الاختبار والأخطاء</summary>';
  h += '<div style="margin:6px 0 2px;font-size:13px">' + (lv ? 'المستوى:<span class="lv ' + lv.k + '">' + lv.t + '</span> ' : '') + (p !== null ? '<span style="color:var(--muted)">(' + AD(Math.round(p)) + '٪)</span>' : '') + '</div>';
  if(errs.length){
    h += '<div class="pb">⚠️ ' + (r.gender === 'f' || r.gender === 'أنثى' || r.gender === 'بنت' ? 'غالب أخطائها: ' : 'غالب أخطائه: ') + topN(tcount, 3).map(x => esc(x[0]) + ' (' + AD(x[1]) + ')').join('، ') + '</div>';
  }
  { const _gf = gflagsOf(r), _fn = fnotesOf(r);
    if(_gf.length || _fn.length){
      h += '<div class="fu"><b>🔎 محتاج متابعة منكِ (مش محسوبة أخطاء)</b>';
      if(_gf.length) h += '<div>' + _gf.map(k => '<span class="fut">' + esc(FLAG_LABELS[k]) + '</span>').join(' ') + '</div>';
      if(_fn.length){ const by = {}; _fn.forEach(e => { (by[e.type] = by[e.type] || []).push(e); });
        Object.keys(by).forEach(t => { h += '<div>• <span class="fut">' + esc(NOTE_LABELS[t]) + '</span> ' + by[t].map(e => '<span class="wd">' + esc(e.word) + '</span> <span style="color:var(--muted);font-size:12px">(' + esc(e.surah) + (e.ayah ? ' آية ' + esc(AD(e.ayah)) : '') + ')</span>').join('، ') + '</div>'; }); }
      h += '</div>';
    } }
  r.questions.forEach(q => {
    const items = String(q.words || '').split(/\s*،\s*/).filter(Boolean);
    h += '<div class="qq"><b>' + esc(q.surah) + '</b>' + (q.ayahRange ? ' <span style="color:var(--muted)">(آيات ' + esc(q.ayahRange) + ')</span>' : '') + ' — ' + (q.mistakes ? 'أخطاء: <b>' + AD(q.mistakes) + '</b>' : '<span style="color:var(--ok)">بدون أخطاء ✨</span>');
    if(items.length){
      h += '<div class="er">' + items.map((it, k) => {
        const m = it.match(/^(.*?)\s*\((آية\s*[^)]*)\)\s*$/), t = (q.wordTypes || [])[k] || '', s = fixSaid((q.wordSaid || [])[k] || '');

function ayahBlocks(q){
  const a = Array.isArray(q.ayahTexts) ? q.ayahTexts.map(p => Array.isArray(p) ? p : (p && typeof p === 'object' ? [p.n, p.t] : null)).filter(p => Array.isArray(p) && p[1]) : [];
  if(!a.length) return '';

    const n = parseInt(String(mm[2]).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)), 10);
    (m[n] = m[n] || []).push(mm[1]);

function shotBlob(canvas){ return new Promise(res => canvas.toBlob(res, 'image/png')); }
async function buildShots(){
  const box = document.createElement('div'); box.id = 'shotBox';
  const hd = document.querySelector('header').cloneNode(true);
  const hb = hd.querySelector('.hbtns'); if(hb) hb.remove();
  box.appendChild(hd);
  const main = document.createElement('main');
  main.style.cssText = 'padding:14px;max-width:none';
  const f = filter !== 'all' ? '<div style="text-align:center;font-weight:800;margin-bottom:8px">' + esc(filter) + '</div>' : '';
  main.innerHTML = f + '<div class="sum">' + $('sum').innerHTML + '</div><div>' + $('list').innerHTML + '</div>';
  box.appendChild(main);
  document.body.appendChild(box);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const opt = {backgroundColor:'#FBF8F0', useCORS:true, logging:false, scrollX:0, scrollY:0, windowWidth:430};
    const W = box.offsetWidth, H = box.offsetHeight;
    // لو الطول كبير أوي نقسّم الصور على حدود كروت الفصول عشان الموبايل مايرفضش
    if(W * H * 4 <= 14e6){
      const c = await html2canvas(box, Object.assign({scale:2}, opt));
      return [await shotBlob(c)];
    }
    const out = [];
    const cards = Array.from(box.querySelectorAll('.cls'));
    const groups = []; let cur = [], curH = 0;
    cards.forEach(c => { const h = c.offsetHeight; if(cur.length && curH + h > 3200){ groups.push(cur); cur = []; curH = 0; } cur.push(c); curH += h; });
    if(cur.length) groups.push(cur);
    for(let i = 0; i < groups.length; i++){
      const keep = new Set(groups[i]);
      cards.forEach(c => { c.style.display = keep.has(c) ? '' : 'none'; });
      main.querySelector('.sum').style.display = i === 0 ? '' : 'none';
      hd.style.display = i === 0 ? '' : 'none';
      const c = await html2canvas(box, Object.assign({scale:2}, opt));
      out.push(await shotBlob(c));
    }
    return out;
  } finally { box.remove(); }
}

  const valid = r => r && r.student && r.grade !== '' && r.grade != null;

  const css = document.createElement('style');
  css.textContent =
    '#clsRepOv{position:fixed;inset:0;z-index:2147483647;background:#1b2d4a;overflow:auto;padding:10px;direction:rtl;font-family:Cairo,Tahoma,Arial,sans-serif}' +
    '#clsRepOv .cr-box{background:#fff;color:#111;max-width:820px;margin:0 auto;border-radius:14px;padding:14px;box-sizing:border-box}' +
    '#clsRepOv .cr-ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:10px;margin-bottom:12px;background:#f6f1e3;border:1px solid #C7963E;border-radius:10px;font-size:13px}' +
    '#clsRepOv .cr-ctl label{display:flex;flex-direction:column;gap:3px;font-weight:700}' +
    '#clsRepOv .cr-ctl label.ck{flex-direction:row;align-items:center;gap:6px}' +
    '#clsRepOv .cr-ctl select,#clsRepOv .cr-ctl input[type=date]{font:inherit;padding:6px;border:1px solid #aaa;border-radius:8px;margin:0;width:auto}' +
    '#clsRepOv .cr-ctl input[type=checkbox]{width:auto;margin:0}' +
    '#clsRepOv .cr-ctl button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}' +
    '#clsRepOv .cr-acts{display:flex;flex-wrap:wrap;gap:8px;width:100%}' +
    '#clsRepOv .cr-acts button{flex:1 1 40%;font-size:15px}' +
    '#crExp{position:fixed;left:0;top:0;z-index:-1;width:794px;background:#fff;color:#111;box-sizing:border-box;padding:18px;direction:rtl;font-family:Cairo,Tahoma,Arial,sans-serif;pointer-events:none}' +
    '.cr-head{text-align:center;margin-bottom:10px}.cr-head .c{font-size:24px;font-weight:800;color:#0F2440}.cr-head .t{font-size:19px;font-weight:800}.cr-head .d{font-size:15px;color:#555}' +
    '.cr-sec{margin-bottom:16px}.cr-sec h3{font-size:19px;line-height:1.6;margin:0 0 6px}.cr-sec h3 small{font-size:15px;font-weight:600}' +
    '#clsRepOv table,#crExp table{width:100%;border-collapse:collapse;font-size:19px;table-layout:auto}' +
    '#clsRepOv th,#clsRepOv td,#crExp th,#crExp td{border:1px solid #444;padding:8px 7px;line-height:1.5;text-align:center}' +
    '#clsRepOv th,#crExp th{background:#eadfbd;font-weight:800}' +
    '#clsRepOv td.nm{text-align:right;white-space:nowrap}#crExp td.nm{text-align:right;white-space:normal}' +
    '#clsRepOv #crBody{width:794px;max-width:none;box-sizing:border-box}' +
    '#clsRepOv tr,#crExp tr{break-inside:avoid}' +
    '@media print{.cr-diag{display:none!important}}' +
    '.cr-ok{color:#1a7a3c;font-weight:800}.cr-no{color:#b02a2a;font-weight:800}' +
    '@media print{html.cr-open body>*:not(#clsRepOv){display:none!important}html.cr-open body>#clsRepOv{display:block!important}#clsRepOv{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}#clsRepOv .cr-box{max-width:none!important;padding:0!important;border-radius:0!important}#clsRepOv .cr-ctl{display:none!important}#clsRepOv #crBody{width:auto!important;zoom:1!important}#clsRepOv .pg{break-after:page}#clsRepOv .pg:last-child{break-after:auto}}';
  document.head.appendChild(css);

  function latestPerStudent(list){
    const m = {};
    list.forEach(r => {
      const k = (isS(r) ? 's' : 'j') + '|' + nrm(r.className) + '|' + nrm(r.student), cur = m[k];
      if(!cur || (dOf(r) + String(r.ts || 0).padStart(15, '0')) > (dOf(cur) + String(cur.ts || 0).padStart(15, '0'))) m[k] = r;
    });
    return Object.keys(m).map(k => m[k]);
  }
  function compute(o){
    let list = results.filter(valid);
    if(!o.surah) list = list.filter(r => !isS(r));
    if(o.cls) list = list.filter(r => (r.className || 'بدون فصل') === o.cls);
    if(o.from) list = list.filter(r => dOf(r) >= o.from);
    if(o.to) list = list.filter(r => dOf(r) <= o.to);
    if(o.latest) list = latestPerStudent(list);
    const g = {};
    list.forEach(r => { const c = String(r.className || '').trim() || 'بدون فصل'; (g[c] = g[c] || []).push(r); });
    return Object.keys(g).sort((a, b) => a.localeCompare(b, 'ar')).map(c => ({name: c, rows: g[c].sort((a, b) => String(a.student).localeCompare(String(b.student), 'ar') || (a.ts || 0) - (b.ts || 0))}));
  }
  function subject(r){
    if(isS(r)){ const s = []; (Array.isArray(r.questions) ? r.questions : []).forEach(q => { if(q && q.surah && s.indexOf(q.surah) < 0) s.push(q.surah); }); return s.length ? 'سورة ' + s.join('، ') : ''; }
    return [r.testType || '', r.hizb !== '' && r.hizb != null ? 'حزب ' + r.hizb : '', r.rub ? 'ربع ' + r.rub : ''].filter(Boolean).join(' — ');
  }
  function bodyHtml(o){
    const gs = compute(o), today = ad(new Date().toLocaleDateString('en-GB'));
    let h = '<div class="cr-head"><div class="c">مركز الأمين الثقافي التربوي</div><div class="t">تقرير إجمالي بنتائج الفصول — ' + (o.surah ? 'اختبارات القرآن واختبار على سورة' : 'اختبارات القرآن') + '</div><div class="d">' + today + '</div></div>';
    if(!gs.length) return h + '<div style="text-align:center;padding:20px;color:#777">مفيش اختبارات تطابق الاختيار ده.</div>';
    gs.forEach((g, gi) => {
      let pass = 0, fail = 0;
      const rows = g.rows.map((r, i) => {
        const n = Number(r.grade), p = passOf(r); if(p) pass++; else fail++;
        const label = p ? (fem(r) ? 'ناجحة' : 'ناجح') : (fem(r) ? 'راسبة' : 'راسب');
        const gr = isNaN(n) ? esc(r.grade) : ad(n) + '/' + ad(isS(r) ? 10 : 100);
        const ms = (r.mistakes === '' || r.mistakes == null) ? '-' : ad(r.mistakes);
        return '<tr><td style="width:44px">' + ad(i + 1) + '</td><td class="nm">' + esc(r.student) + '</td><td>' + ms + '</td><td>' + gr + '</td><td class="' + (p ? 'cr-ok' : 'cr-no') + '">' + label + '</td></tr>';
      }).join('');
      const sv = [], sj = [], ss = [];
      g.rows.forEach(r => { const v = String(r.supervisorName || '').trim(); if(v && sv.indexOf(v) < 0) sv.push(v); if(!isS(r)){ const t = subject(r); if(t && sj.indexOf(t) < 0) sj.push(t); } else { (Array.isArray(r.questions) ? r.questions : []).forEach(q => { if(q && q.surah && ss.indexOf(q.surah) < 0) ss.push(q.surah); }); } });
      h += '<div class="cr-sec' + (o.pages && gi < gs.length - 1 ? ' pg' : '') + '"><h3>الفصل: ' + esc(g.name) +
        ' <span style="color:#8A6A20">— المحفظ/ة: ' + (sv.length ? esc(sv.join('، ').replace(/^\s*أ\s*[.\/]\s*/, '')) : 'غير محددة') + '</span>' +
        (sj.length ? ' <span style="color:#1d4f8a">— ' + esc(sj.join('، ')) + '</span>' : '') +
        (ss.length ? ' <span style="color:#1d4f8a">— السورة: ' + esc(ss.join('، ')) + '</span>' : '') +
        ' <small>(عدد الطلاب: ' + ad(g.rows.length) + ' — ناجح: ' + ad(pass) + ' — راسب: ' + ad(fail) + ')</small></h3>' +
        '<table><thead><tr><th>م</th><th>الإسم</th><th>عدد الأخطاء</th><th>الدرجة</th><th>النتيجة</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    });
    return h;
  }
  function diagHtml(o){
    const cn = r => String(r.className || '').trim() || 'بدون فصل', bad = [];
    results.forEach(r => {
      if(o.cls && cn(r) !== o.cls) return;
      const d = dOf(r); let why = '';
      if(!r.student || r.grade === '' || r.grade == null) why = 'مفيش اسم طالب أو درجة';
      else if(!o.surah && isS(r)) why = 'اختبار على سورة (الخانة مش متعلّمة)';
      else if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) why = 'تاريخ غير مقروء: ' + esc(r.date == null ? 'فاضي' : (r.date.toDate ? 'Timestamp' : r.date));
      else if((o.from && d < o.from) || (o.to && d > o.to)) why = 'تاريخه ' + ad(d) + ' خارج الفترة';
      if(why) bad.push(esc(cn(r)) + ' — ' + esc(r.student || '(بدون اسم)') + ' — ' + why);
    });
    let inRange = results.filter(valid); if(!o.surah) inRange = inRange.filter(r => !isS(r));
    if(o.cls) inRange = inRange.filter(r => cn(r) === o.cls);
    if(o.from) inRange = inRange.filter(r => dOf(r) >= o.from);
    if(o.to) inRange = inRange.filter(r => dOf(r) <= o.to);
    const hiddenOld = o.latest ? inRange.length - latestPerStudent(inRange).length : 0;
    let h = '<div class="cr-diag" style="margin-top:14px;padding:10px;border:2px dashed #C7963E;border-radius:10px;background:#fffaf0;font-size:14px;line-height:1.8"><b>🔎 نتايج مش ظاهرة في التقرير (للمراجعة بس — مش بتتطبع)</b><br>';
    h += 'إجمالي النتايج المحمّلة: ' + ad(results.length) + '<br>';
    if(hiddenOld) h += 'اتخفى ' + ad(hiddenOld) + ' اختبار قديم لطلاب اتختبروا تاني (علامة «آخر اختبار لكل طالب بس»).<br>';
    if(!bad.length) h += '✅ مفيش نتايج مستبعدة لسبب تاني.';
    else h += '<b>' + ad(bad.length) + ' مستبعدة:</b><br>' + bad.slice(0, 60).map(x => '• ' + x).join('<br>') + (bad.length > 60 ? '<br>…' : '');
    return h + '</div>';
  }
  function textReport(o){
    const gs = compute(o); if(!gs.length) return '';
    let t = '*مركز الأمين الثقافي التربوي*\n*تقرير إجمالي بنتائج الفصول*\n' + ad(new Date().toLocaleDateString('en-GB')) + '\n';
    gs.forEach(g => {
      let ok = 0; g.rows.forEach(r => { if(passOf(r)) ok++; });
      t += '\n*الفصل: ' + g.name + '* (ناجح ' + ad(ok) + ' — راسب ' + ad(g.rows.length - ok) + ')\n';
      g.rows.forEach((r, i) => { const n = Number(r.grade); t += ad(i + 1) + '. ' + r.student + ' — ' + (isNaN(n) ? r.grade : ad(n) + '/' + ad(isS(r) ? 10 : 100)) + ' — ' + (passOf(r) ? (fem(r) ? 'ناجحة' : 'ناجح') : (fem(r) ? 'راسبة' : 'راسب')) + '\n'; });
    });
    return t;
  }

  function openReport(){
    const old = $('clsRepOv'); if(old) old.remove();
    const names = [...new Set(results.filter(valid).map(r => String(r.className || '').trim() || 'بدون فصل'))].sort((a, b) => a.localeCompare(b, 'ar'));
    // الأسابيع (السبت → الجمعة)
    const now = new Date(), todayS = isoD(now), start0 = new Date(now); start0.setDate(now.getDate() - ((now.getDay() + 1) % 7));
    const weeks = [];
    for(let k = 0; k < 8; k++){
      const s = new Date(start0); s.setDate(s.getDate() - 7 * k);
      const e = new Date(s); e.setDate(e.getDate() + 6);
      const from = isoD(s), to = (k === 0 && isoD(e) > todayS) ? todayS : isoD(e);
      const cn = new Set(results.filter(valid).filter(r => dOf(r) >= from && dOf(r) <= to).map(r => r.className || 'بدون فصل')).size;
      const eD = new Date(to + 'T12:00:00');
      weeks.push({from, to, label: ad(p2(s.getDate()) + '/' + p2(s.getMonth() + 1)) + ' إلى ' + ad(p2(eD.getDate()) + '/' + p2(eD.getMonth() + 1)) + ' (' + ad(cn) + ' فصل' + (k === 0 ? ' — الأسبوع ده' : '') + ')'});
    }
    const ov = document.createElement('div'); ov.id = 'clsRepOv';
    ov.innerHTML = '<div class="cr-box"><div class="cr-ctl">' +
      '<label>الفصل<select id="crCls"><option value="">كل الفصول</option>' + names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('') + '</select></label>' +
      '<label>الأسبوع<select id="crWeekSel"><option value="">كل الفترات</option>' + weeks.map((w, i) => '<option value="' + i + '">' + w.label + '</option>').join('') + '</select></label>' +
      '<label>من تاريخ<input type="date" id="crFrom"></label><label>إلى تاريخ<input type="date" id="crTo"></label>' +
      '<label class="ck"><input type="checkbox" id="crLatest" checked> آخر اختبار لكل طالب بس</label>' +
      '<label class="ck"><input type="checkbox" id="crPages"> كل فصل في صفحة</label>' +
      '<label class="ck"><input type="checkbox" id="crSurah" checked> يشمل اختبارات «اختبار على سورة»</label>' +
      '<div class="cr-acts">' +
      '<button type="button" id="crPrint" style="background:#0F2440;color:#fff">🖨️ طباعة</button>' +
      '<button type="button" id="crPrintL" style="background:#0F2440;color:#fff">🖨️ طباعة عرضي</button>' +
      '<button type="button" id="crPdf" style="background:#B02A2A;color:#fff">📄 حفظ PDF</button>' +
      '<button type="button" id="crWa" style="background:#1a9d4b;color:#fff">📲 واتساب PDF</button>' +
      '<button type="button" id="crImg" style="background:#1d4f8a;color:#fff">🖼️ صورة</button>' +
      '<button type="button" id="crWaTxt" style="background:#1a9d4b;color:#fff">💬 واتساب نص</button>' +
      '</div><div id="crMsg" style="width:100%;font-weight:700;color:#8A6A20"></div>' +
      '<button type="button" id="crClose" style="background:#eee;color:#0F2440">إغلاق</button></div>' +
      '<div id="crBody"></div></div>';
    document.body.appendChild(ov);
    document.documentElement.classList.add('cr-open');
    const g = id => $(id), msg = t => { g('crMsg').textContent = t || ''; };
    const opts = () => ({cls: g('crCls').value, from: g('crFrom').value, to: g('crTo').value, latest: g('crLatest').checked, pages: g('crPages').checked, surah: g('crSurah').checked});
    function fit(){
      const bd = g('crBody'); if(!bd) return;
      const box = bd.parentNode, cs = getComputedStyle(box), avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      bd.style.zoom = '1'; bd.style.width = '400px';
      let w = 400; bd.querySelectorAll('table').forEach(tb => { if(tb.offsetWidth > w) w = tb.offsetWidth; });
      bd.style.width = w + 'px';
      const z = Math.min(1, avail / w);
      bd.style.zoom = z > 0 ? String(z) : '1';
    }
    function redraw(){ g('crBody').innerHTML = bodyHtml(opts()) + (location.hash === '#diag' ? diagHtml(opts()) : ''); fit(); }
    const onResize = () => fit(); window.addEventListener('resize', onResize);
    function close(){ window.__crRedraw = null; window.removeEventListener('resize', onResize); ov.remove(); document.documentElement.classList.remove('cr-open'); }
    g('crClose').onclick = close;
    g('crWeekSel').addEventListener('change', () => {
      const v = g('crWeekSel').value;
      if(v === ''){ g('crFrom').value = ''; g('crTo').value = ''; }
      else { g('crFrom').value = weeks[+v].from; g('crTo').value = weeks[+v].to; }
      redraw();
    });
    ['crFrom', 'crTo'].forEach(id => g(id).addEventListener('change', () => { g('crWeekSel').value = ''; redraw(); }));
    ['crCls', 'crLatest', 'crPages', 'crSurah'].forEach(id => g(id).addEventListener('change', redraw));
    // افتراضي: الأسبوع الحالي
    g('crWeekSel').value = ''; g('crFrom').value = ''; g('crTo').value = '';
    redraw();
    window.__crRedraw = function(){
      const sel = g('crCls'); if(!sel) return;
      const v = sel.value, nn = [...new Set(results.filter(valid).map(r => String(r.className || '').trim() || 'بدون فصل'))].sort((a, b) => a.localeCompare(b, 'ar'));
      sel.innerHTML = '<option value="">كل الفصول</option>' + nn.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
      sel.value = nn.indexOf(v) >= 0 ? v : '';
      redraw();
    };

    function printAs(orient){
      const st = document.createElement('style'); st.id = 'crPageSt'; st.textContent = '@page{size:A4 ' + orient + ';margin:10mm}'; document.head.appendChild(st);
      const done = () => { const x = $('crPageSt'); if(x) x.remove(); window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done); window.print(); setTimeout(done, 60000);
    }
    g('crPrint').onclick = () => printAs('portrait');
    g('crPrintL').onclick = () => printAs('landscape');

    /* ===== صفحات A4 كصور (الفصل ما يتقطعش نصين لو دخل في صفحة) ===== */
    async function pagesCanvases(){
      if(typeof html2canvas === 'undefined') throw new Error('html2canvas');
      let x = $('crExp'); if(x) x.remove();
      x = document.createElement('div'); x.id = 'crExp'; x.innerHTML = bodyHtml(opts()); document.body.appendChild(x);
      try{
        if(document.fonts && document.fonts.ready) await document.fonts.ready;
        const SC = 2, PW = 794, PH = 1123, PAD = 18, usable = PH - PAD * 2, list = [];
        for(const b of Array.from(x.children)){
          const c = await html2canvas(b, {scale: SC, backgroundColor: '#ffffff', logging: false, scrollX: 0, scrollY: 0, windowWidth: 900});
          list.push({head: b.classList.contains('cr-head'), c, h: c.height / SC});
        }
        const pages = []; let cur = null, used = 0;
        const np = () => { cur = []; used = 0; pages.push(cur); }; np();
        list.forEach(it => {
          if(!it.head && g('crPages').checked && cur.some(q => !q.head)) np();
          if(used + it.h > usable && cur.length) np();
          cur.push(it); used += it.h + 12;
        });
        return pages.map(items => {
          const c = document.createElement('canvas'); c.width = PW * SC; c.height = PH * SC;
          const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
          let y = PAD;
          items.forEach(it => {
            const w = it.c.width / SC; let k = 1; if(w > PW - PAD * 2) k = (PW - PAD * 2) / w;
            const dw = w * k, dh = it.h * k;
            cx.drawImage(it.c, (PW - dw) / 2 * SC, y * SC, dw * SC, dh * SC); y += dh + 12;
          });
          return c;
        });
      } finally { x.remove(); }
    }
    const stem = () => 'تقرير-الفصول-' + isoD(new Date());
    const toBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
    async function makePdf(){
      const cs = await pagesCanvases();
      if(!(window.jspdf && window.jspdf.jsPDF)) throw new Error('jspdf');
      const pdf = new window.jspdf.jsPDF({unit: 'mm', format: 'a4', orientation: 'p'});
      cs.forEach((c, i) => { if(i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297); });
      return pdf.output('blob');
    }
    function saveFiles(files){
      files.forEach(f => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 1500); });
    }
    async function shareFiles(files, title){
      if(navigator.canShare && navigator.canShare({files})){
        try{ await navigator.share({files, title}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
      }
      saveFiles(files); msg('اتحفظ الملف في الجهاز — ابعتيه من واتساب من الملفات/المعرض.');
    }
    async function run(btn, fn){
      if(!compute(opts()).length){ msg('مفيش اختبارات تطابق الاختيار ده.'); return; }
      const old = btn.textContent; btn.disabled = true; btn.textContent = '⏳ ...'; msg('');
      try{ await fn(); }
      catch(e){ msg(e && /jspdf/.test(e.message) ? 'مكتبة PDF مش متحمّلة — اتأكدي من النت وجرّبي تاني.' : 'حصلت مشكلة في التجهيز، جرّبي تاني.'); }
      btn.disabled = false; btn.textContent = old;
    }
    g('crPdf').onclick = () => run(g('crPdf'), async () => { saveFiles([new File([await makePdf()], stem() + '.pdf', {type: 'application/pdf'})]); });
    g('crWa').onclick = () => run(g('crWa'), async () => { await shareFiles([new File([await makePdf()], stem() + '.pdf', {type: 'application/pdf'})], 'تقرير الفصول'); });
    g('crImg').onclick = () => run(g('crImg'), async () => {
      const cs = await pagesCanvases(), files = [];
      for(let i = 0; i < cs.length; i++) files.push(new File([await toBlob(cs[i], 'image/png')], stem() + (cs.length > 1 ? '-' + (i + 1) : '') + '.png', {type: 'image/png'}));
      await shareFiles(files, 'تقرير الفصول');
    });
    g('crWaTxt').onclick = () => {
      const t = textReport(opts()); if(!t){ msg('مفيش اختبارات تطابق الاختيار ده.'); return; }
      const w = window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
      if(!w){ try{ navigator.clipboard.writeText(t); msg('اتنسخ النص، الصقيه في واتساب ✓'); }catch(_){ prompt('انسخي النص:', t); } }
    };
  }
  window.openClassReport = openReport;
  $('crBtn').addEventListener('click', openReport);
})();
</script>
